<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPet: Pixel Sandbox</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load YouTube Iframe Player API -->
    <script src="https://youtube.com"></script>
</head>
<body>
    <!-- Hidden YouTube Video Wrapper managed by the Audio Mixer Engine -->
    <div id="yt-audio-container" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px;"></div>

    <div class="handheld-console">
        <div class="screen-bevel">
            <!-- Top Status Matrix -->
            <div class="lcd-header">
                <div class="lcd-led" id="status-led"></div>
                <div class="lcd-stat">CASH: $<span id="lbl-money">100</span></div>
                <div class="lcd-stat">AGE: <span id="lbl-age">0</span></div>
            </div>

            <!-- Virtual Sandbox Room Screen -->
            <canvas id="room-canvas" width="400" height="220" class="pixel-screen"></canvas>

            <!-- Hardware Progress Gauges -->
            <div class="gauge-cluster">
                <div class="gauge-node">
                    <span class="g-lbl">FOOD</span>
                    <div class="g-track"><div id="bar-food" class="g-fill food"></div></div>
                </div>
                <div class="gauge-node">
                    <span class="g-lbl">ENRG</span>
                    <div class="g-track"><div id="bar-energy" class="g-fill energy"></div></div>
                </div>
                <div class="gauge-node">
                    <span class="g-lbl">HAPP</span>
                    <div class="g-track"><div id="bar-happy" class="g-fill happy"></div></div>
                </div>
            </div>
        </div>

        <!-- Primary Hardware Buttons -->
        <div class="dpad-action-grid">
            <button class="c-btn" onclick="openMinigameSelector()">💼 WORK</button>
            <button class="c-btn" onclick="feedPet()">🍖 FEED ($10)</button>
            <button class="c-btn" id="btn-sleep" onclick="toggleSleep()">😴 SLEEP</button>
            <button class="c-btn" onclick="openHomeEditor()">🛋️ DECOR</button>
            <button class="c-btn highlight" onclick="openPixelEditor()">🎨 PAINT</button>
            <button class="c-btn" onclick="openSettings()">⚙️ SYSTEM</button>
        </div>
        
        <!-- Cartridge Disk Backup Interfaces -->
        <div class="cartridge-io-deck">
            <button onclick="exportPetFile()" class="io-btn">📤 EXPORT .PET</button>
            <button onclick="document.getElementById('import-trigger').click()" class="io-btn">📥 IMPORT .PET</button>
            <input type="file" id="import-trigger" style="display:none" onchange="importPetFile(event)">
        </div>
    </div>

    <!-- SYSTEM SUB-PANELS (MODALS) -->
    <!-- Sound Configuration Dashboard -->
    <div id="modal-settings" class="modal hidden">
        <div class="modal-box">
            <h3>⚙️ AUDIO MIXER MATRIX</h3>
            <div class="slider-row">
                <label>🎵 LO-FI YOUTUBE STREAM</label>
                <input type="range" id="vol-music" min="0" max="100" value="40" oninput="adjustMusicVolume(this.value)">
                <small style="color:#888; font-size:0.75rem; display:block; margin-top:4px;">Streams live chillhop beats via background API</small>
            </div>
            <div class="slider-row">
                <label>🔊 CUTE ARCADE SFX</label>
                <input type="range" id="vol-sfx" min="0" max="100" value="50" oninput="adjustSFXVolume(this.value)">
            </div>
            <button class="modal-close" onclick="closeModals()">RETURN TO SYSTEM</button>
        </div>
    </div>

    <!-- 16x16 Pixel Designer Matrix -->
    <div id="modal-pixel" class="modal hidden">
        <div class="modal-box large">
            <h3>🎨 16x16 SPRITE SPRITE SHEET STUDIO</h3>
            <div class="editor-workspace">
                <div class="editor-sidebar">
                    <label>ANIMATION ENGINE STATE:</label>
                    <select id="editor-state-select" onchange="loadStateToPixelCanvas()">
                        <option value="neutral">😐 NEUTRAL (IDLE)</option>
                        <option value="wandering">🏃 WANDERING</option>
                        <option value="happy">✨ HAPPY</option>
                        <option value="sad">😢 SAD</option>
                        <option value="hungry">🤤 HUNGRY</option>
                        <option value="tired">😫 TIRED</option>
                        <option value="sleeping">😴 SLEEPING</option>
                        <option value="dead">💀 DEAD</option>
                    </select>
                    <div class="palette-grid">
                        <div class="swatch active" style="background:#000000" onclick="setPaintColor('#000000', this)"></div>
                        <div class="swatch" style="background:#ff4757" onclick="setPaintColor('#ff4757', this)"></div>
                        <div class="swatch" style="background:#2ed573" onclick="setPaintColor('#2ed573', this)"></div>
                        <div class="swatch" style="background:#1e90ff" onclick="setPaintColor('#1e90ff', this)"></div>
                        <div class="swatch" style="background:#ffa502" onclick="setPaintColor('#ffa502', this)"></div>
                        <div class="swatch" style="background:#ffffff" onclick="setPaintColor('#ffffff', this)"></div>
                        <div class="swatch clear-tool" style="background:transparent" onclick="setPaintColor('transparent', this)">❌</div>
                    </div>
                    <button class="preset-btn" onclick="usePremadeSet()">🔄 RELOAD FACTORY PIXELS</button>
                </div>
                <div id="pixel-canvas-grid" class="canvas-grid-container"></div>
            </div>
            <button onclick="savePixelArtChanges()" class="commit-btn">💾 INJECT TEXTURES TO CANVAS</button>
            <button class="modal-close" onclick="closeModals()">CLOSE GRAPHICS CANVAS</button>
        </div>
    </div>

    <!-- Room Blueprint Furniture Placement Editor -->
    <div id="modal-home" class="modal hidden">
        <div class="modal-box">
            <h3>🛋️ BLUEPRINT FURNITURE STACKER</h3>
            <p style="font-size:0.8rem; color:#8a8d9a;">Select an asset. Then tap on the console main screen matrix to deploy it!</p>
            <div class="furniture-catalog">
                <button onclick="selectFurnitureToken('bed')">🛏️ PIXEL BED</button>
                <button onclick="selectFurnitureToken('plant')">🪴 POT FERN</button>
                <button onclick="selectFurnitureToken('tv')">📺 CRT SCREEN</button>
                <button onclick="selectFurnitureToken('chair')">🪑 DECK CHAIR</button>
                <button onclick="clearAllFurniture()" style="background:#ff4757;">🧹 WIPE ROOM ITEMS</button>
            </div>
            <button class="modal-close" onclick="closeModals()" style="margin-top:15px; width:100%;">APPLY FURNITURE COORD LAYERS</button>
        </div>
    </div>

    <!-- Workspace Mini Task Terminal -->
    <div id="modal-minigame" class="modal hidden">
        <div class="modal-box medium">
            <h3 id="minigame-title">💼 WORKSTATION MINI-SHELL</h3>
            <div id="minigame-playground" class="arcade-viewport"></div>
            <p id="minigame-feedback" style="font-size:0.85rem; background:#0f0f15; padding:8px; border-radius:4px; min-height:30px;"></p>
            <button onclick="closeModals()" id="btn-close-game" style="display:none; width:100%;" class="commit-btn">COLLECT PAYROLL & RETURN</button>
        </div>
    </div>

    <script src="audio.js"></script>
    <script src="editors.js"></script>
    <script src="minigames.js"></script>
    <script src="engine.js"></script>
</body>
</html>
